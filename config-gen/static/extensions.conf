; Static dialplan. There is deliberately almost nothing here:
; every call is handed to pbx-brain via ARI, which owns all logic.
; Rendered once at install (not per-change like pjsip.conf).

[extensions]
; Phones, arriving via Kamailio or directly.
; _X. matches numeric extensions; _*X. matches * feature codes.
exten => _X.,1,NoOp(internal ${CALLERID(num)} -> ${EXTEN})
 same => n,Stasis(pbx-brain,internal,${EXTEN})
 same => n,Hangup()
exten => _*X.,1,NoOp(feature ${CALLERID(num)} -> ${EXTEN})
 same => n,Stasis(pbx-brain,internal,${EXTEN})
 same => n,Hangup()

[trunk-in]
; Provider trunks land here with the DID as ${EXTEN}.
; Fax on an ordinary number: pbx-agi says how long to listen (FAXWAIT, 0 =
; fax detection off for this number). If on, answer, play ringing and listen
; for a fax's calling tone (CNG) or a T.38 offer; either jumps to the `fax`
; extension below. Otherwise the call carries on to pbx-brain as usual.
exten => _X.,1,NoOp(inbound DID ${EXTEN})
 same => n,Set(PBX_DID=${EXTEN})
 same => n,Set(FAXWAIT=0)
 same => n,AGI(agi://127.0.0.1/fax-check,${EXTEN})
 same => n,GotoIf($[${FAXWAIT} > 0]?listen)
 same => n(route),Stasis(pbx-brain,inbound,${PBX_DID})
 same => n,Hangup()
 same => n(listen),Answer()
 same => n,Set(FAXOPT(faxdetect)=yes,${FAXWAIT})
 ; Ringback spelled out (US 440+480 Hz, 2 s on / 4 s off): a named tone
 ; like "ring" needs indications.conf, which a PBX may not have, and a
 ; failed Playtones hangs the call up. TryExec: never drop a call over this.
 same => n,TryExec(Playtones(440+480/2000,0/4000))
 same => n,Wait(${FAXWAIT})
 same => n,TryExec(StopPlaytones())
 same => n,Set(FAXOPT(faxdetect)=no)
 same => n,Goto(route)

exten => fax,1,NoOp(fax on ${PBX_DID} from ${CALLERID(num)})
 same => n,TryExec(StopPlaytones())
 same => n,Set(FAXFILE=/var/spool/pbx/fax/fax-${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-${CUT(UNIQUEID,.,2)}.tif)
 same => n,Set(CHANNEL(hangup_handler_push)=pbx-fax-done,s,1)
 ; Internet phone lines distort fax audio a little; 9600 baud with error
 ; correction (ECM) is far more reliable than the 14400 default.
 same => n,Set(FAXOPT(maxrate)=9600)
 same => n,Set(FAXOPT(ecm)=yes)
 same => n,ReceiveFAX(${FAXFILE},f)
 same => n,Hangup()

;; Sending a fax (pbx-brain faxout.py): the far end answered; play the pages.
[pbx-fax-send]
exten => s,1,NoOp(fax out ${FAXOUT_ID} to ${CALLERID(dnid)})
 same => n,Set(CHANNEL(hangup_handler_push)=pbx-fax-sent,s,1)
 same => n,Set(FAXOPT(localstationid)=${FAXOUT_STATION})
 same => n,Set(FAXOPT(headerinfo)=${FAXOUT_HEADER})
 same => n,Set(FAXOPT(maxrate)=9600)
 same => n,Set(FAXOPT(ecm)=yes)
 same => n,SendFAX(${FAXOUT_FILE},f)
 same => n,Hangup()

[pbx-fax-sent]
exten => s,1,AGI(agi://127.0.0.1/fax-sent,${FAXOUT_ID},${FAXSTATUS},${FAXPAGES},b64:${BASE64_ENCODE(${FAXERROR})})
 same => n,Return()

[pbx-fax-done]
; Runs after the fax call ends (received or not): pbx-agi converts it to a
; PDF, files it for whoever the number rings, and emails it.
exten => s,1,AGI(agi://127.0.0.1/fax-done,${FAXFILE},${FAXSTATUS},${FAXPAGES},b64:${BASE64_ENCODE(${FAXERROR})},${PBX_DID},b64:${BASE64_ENCODE(${CALLERID(num)})},b64:${BASE64_ENCODE(${REMOTESTATIONID})})
 same => n,Return()

[pbx-msg]
; Out-of-dialog SIP MESSAGE (ext-to-ext texting) -> FastAGI in pbx-brain,
; which enforces quotas and delivers via MessageSend.
exten => _X.,1,NoOp(msg -> ${EXTEN})
; From and body are base64-encoded: AGI args are sent as "agi_arg_N: value"
; lines, so a raw body containing a newline could forge other args (e.g. the
; sender), and a comma would cut the body short.
 same => n,AGI(agi://127.0.0.1/msg-route,${EXTEN},b64:${BASE64_ENCODE(${MESSAGE(from)})},b64:${BASE64_ENCODE(${MESSAGE(body)})})
 same => n,Hangup()

; Replies to external SMS arrive addressed to +E.164 (e.g. +15551234567).
; _X. requires a leading digit, so without this those MESSAGEs get a 404.
exten => _+X.,1,NoOp(msg -> ${EXTEN})
 same => n,AGI(agi://127.0.0.1/msg-route,${EXTEN},b64:${BASE64_ENCODE(${MESSAGE(from)})},b64:${BASE64_ENCODE(${MESSAGE(body)})})
 same => n,Hangup()
