<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>own-pbx — live demo</title>
<style>
:root{
  --bg:#0d0d12; --panel:#17171f; --card:#1d1d28; --inset:#13131b;
  --border:#282833; --border2:#33333f;
  --text:#e9e9f0; --muted:#9a9aad; --faint:#6f6f82;
  --accent:#f96a00; --accent-hi:#ff7d1f;
  --green:#3fb96f; --green-bg:rgba(46,160,90,.16);
  --red:#e5534b; --amber:#d9a441; --amber-bg:rgba(217,164,65,.12);
  --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#6ea8fe}
button{font:inherit;cursor:pointer}
.hidden{display:none!important}

/* ---------- top gradient bar (matches the panel) ---------- */
.topbar{background:linear-gradient(90deg,#ffd60a 0%,#ffb300 45%,#ff8a00 100%);height:46px;display:flex;align-items:center;padding:0 14px;gap:10px}
.topbar .mark{display:flex;align-items:center;gap:8px;color:#fff;font-weight:800;font-size:19px;letter-spacing:.2px;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.topbar .mark .pin{width:22px;height:22px;border-radius:50%;background:#2b6cb0;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:13px}
.topbar .mark small{display:block;font-size:8.5px;font-weight:600;letter-spacing:.4px;opacity:.9;line-height:1}
.topbar .who{margin-left:auto;color:#fff;font-size:14px;display:flex;gap:14px;align-items:center;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.topbar .who button{background:none;border:none;color:#fff;font:inherit;padding:0}
.topbar .who button:hover{text-decoration:underline}

/* ---------- layout ---------- */
.wrap{max-width:1100px;margin:0 auto;padding:22px 16px 30px}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.pills button{background:var(--card);color:#d8d8e2;border:1px solid transparent;border-radius:7px;padding:8px 15px;font-size:14.5px}
.pills button:hover{border-color:var(--border2)}
.pills button.active{background:var(--accent);color:#fff;font-weight:600}
.pills.sub{background:none}
.pills.sub button{background:none;color:var(--muted);border-radius:0;padding:6px 10px;border-bottom:2px solid transparent}
.pills.sub button.active{background:none;color:var(--accent);border-bottom-color:var(--accent)}

.banner{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:8px;padding:11px 16px;margin:14px 0 16px;font-size:14.5px}
.banner.ok{border-left-color:var(--green)}

.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:26px 28px}
.panel h1,.panel h2.title{font-size:24px;margin:0 0 6px;font-weight:700}
.panel h2{font-size:20px;margin:26px 0 10px;font-weight:700}
.panel h2:first-child{margin-top:0}
.panel h3{font-size:16.5px;margin:0 0 8px;font-weight:700}
.lede{color:var(--muted);font-size:13.5px;margin:0 0 14px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cols3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
@media(max-width:900px){.cols,.cols3{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px}
.card h3{margin-top:0}

table{width:100%;border-collapse:collapse;font-size:14.5px;margin:6px 0 4px}
th{background:#22222f;text-align:left;padding:9px 10px;font-size:14px;color:#fff}
td{padding:9px 10px;border-bottom:1px solid var(--border);color:#d3d3de;vertical-align:top}
tr:last-child td{border-bottom:none}
td.dim,th.dim{color:var(--muted)}
.empty{color:var(--muted);font-style:italic;padding:10px}

.btn{background:var(--accent);color:#fff;border:1px solid var(--accent);border-radius:7px;padding:7px 16px;font-size:14px;font-weight:600}
.btn:hover{background:var(--accent-hi)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.ghost:hover{background:rgba(249,106,0,.1)}
.btn.danger{background:transparent;color:#ff8a80;border-color:rgba(229,83,75,.55)}
.btn.danger:hover{background:rgba(229,83,75,.12)}
.btn.sm{padding:4px 12px;font-size:13.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.linklike{background:none;border:none;color:#6ea8fe;padding:0;font-size:14px}
.linklike:hover{text-decoration:underline}
.danger-text{color:#ff8a80;background:none;border:none;padding:0;font-size:14px;cursor:pointer}
.danger-text:hover{text-decoration:underline}

label{display:block;font-size:14px;margin:12px 0 5px;color:#dcdce6}
label:first-child{margin-top:0}
input[type=text],input[type=email],input[type=password],input[type=number],select,textarea{
  width:100%;background:var(--inset);border:1px solid var(--border2);border-radius:7px;color:var(--text);
  padding:8px 11px;font:inherit;font-size:14.5px}
input::placeholder,textarea::placeholder{color:var(--faint)}
.hint{color:var(--muted);font-size:12.5px;margin-top:6px;line-height:1.45}
.check{display:flex;gap:9px;align-items:flex-start;margin:10px 0;font-size:14.5px}
.check input{margin-top:3px;width:16px;height:16px;accent-color:var(--accent)}
fieldset{border:none;padding:0;margin:0}

.badge{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:600;vertical-align:middle}
.badge.green{background:var(--green-bg);color:#4ade80}
.badge.grey{background:#2a2a38;color:var(--muted)}
.badge.red{background:rgba(229,83,75,.16);color:#ff8a80}
.badge.amber{background:var(--amber-bg);color:var(--amber)}
.tagchip{display:inline-block;background:#2a2a38;border-radius:5px;padding:0 7px;font-size:12.5px;color:var(--muted)}

.alert{border-radius:8px;padding:13px 16px;font-size:14px;margin:12px 0;line-height:1.5}
.alert.red{background:rgba(229,83,75,.13);color:#ffb4ab}
.alert.amber{background:var(--amber-bg);color:#ecd29a}
.alert.green{background:var(--green-bg);color:#a7e8c0}
.alert b{color:#fff}

.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin:16px 0 6px}
@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 10px;text-align:center}
.stat .n{font-size:27px;font-weight:700}
.stat .l{color:var(--muted);font-size:12.5px;margin-top:2px}

.statusbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;font-size:14.5px}
.statusbar .sep{color:var(--faint)}

.footer{text-align:center;color:var(--faint);font-size:12.5px;padding:26px 10px 34px}

/* ---------- login ---------- */
.loginwrap{min-height:calc(100vh - 46px);display:flex;align-items:flex-start;justify-content:center;padding:56px 16px}
.logincard{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:34px 38px;width:430px;max-width:100%;text-align:center}
.logincard .biglogo{font-size:30px;font-weight:800}
.logincard .biglogo span{color:#60a5fa}
.logincard .slogan{color:var(--accent);font-size:13px;margin-top:2px}
.logincard p{color:var(--muted);font-size:14px}
.logincard .btn{width:100%;margin-top:10px;padding:11px}
.logincard .alt{margin-top:16px;font-size:13.5px;color:var(--muted)}

/* ---------- modal / toast ---------- */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:50}
.modal .box{background:var(--panel);border:1px solid var(--border2);border-radius:12px;padding:24px 26px;width:360px;max-width:92vw}
.modal h3{margin:0 0 6px}
.modal p{color:var(--muted);font-size:14px}
.modal .row{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#22222f;border:1px solid var(--border2);color:var(--text);padding:10px 18px;border-radius:8px;font-size:14px;z-index:60;box-shadow:0 8px 30px rgba(0,0,0,.5)}

/* ---------- portal bits ---------- */
.subtabs{display:flex;flex-wrap:wrap;gap:2px;border-bottom:1px solid var(--border);margin-bottom:18px}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:14px 0}
@media(max-width:900px){.statgrid{grid-template-columns:repeat(2,1fr)}}
.msglist{display:grid;grid-template-columns:250px 1fr;gap:0;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
@media(max-width:700px){.msglist{grid-template-columns:1fr}}
.msglist .convs{background:var(--inset);border-right:1px solid var(--border);padding:10px}
.msglist .conv{padding:9px 10px;border-radius:7px;cursor:pointer}
.msglist .conv.active{background:#2a2a38}
.msglist .thread{padding:16px}
.bubble{background:#2a2a38;border-radius:10px;padding:9px 13px;display:inline-block;max-width:80%}
.meter{height:6px;background:#2a2a38;border-radius:3px;overflow:hidden;vertical-align:middle;display:inline-block;width:110px}
.meter i{display:block;height:100%;background:var(--accent)}
.plancard .price{font-size:27px;font-weight:800}
.plancard ul{margin:8px 0;padding-left:20px;color:#d3d3de;font-size:14.5px}
code{background:var(--inset);border:1px solid var(--border);border-radius:5px;padding:1px 6px;font-size:13px}
pre{background:var(--inset);border:1px solid var(--border);border-radius:8px;padding:12px;overflow:auto;font-size:13px}
</style>
</head>
<body>
<div class="topbar">
  <div class="mark"><span class="pin">◎</span><span>PBX<small>new phone, who dis?</small></span></div>
  <div class="who" id="who"></div>
</div>

<div id="login" class="loginwrap">
  <div class="logincard">
    <div class="biglogo">🎧 PBX</div>
    <div class="slogan">new phone, who dis?</div>
    <h2 style="margin:18px 0 4px">LOGON</h2>
    <p>contact support at ext 100 if you need login help</p>
    <label style="text-align:left">Username</label>
    <input type="text" id="lu" value="admin">
    <label style="text-align:left">Password</label>
    <input type="password" id="lp" value="demo">
    <button class="btn" onclick="doLogin()">Sign in</button>
    <div class="alt">This is a <b>live demo</b> with made-up data — nothing is real and nothing is saved.<br><br>
    <button class="linklike" onclick="quickLogin('admin')">Look around as the admin →</button><br>
    <button class="linklike" onclick="quickLogin('user')">Look around as a phone user →</button></div>
  </div>
</div>

<div id="app" class="hidden">
  <div class="wrap">
    <nav class="pills" id="mainnav"></nav>
    <nav class="pills sub hidden" id="subnav"></nav>
    <div id="pinbanner"></div>
    <main class="panel" id="view"></main>
  </div>
  <div class="footer">own-pbx demo · all names, numbers and data on this page are fictional · GPL-2.0-or-later</div>
</div>

<div id="modal" class="hidden"></div>
<div id="toast" class="toast hidden"></div>

<script>
"use strict";
/* ================= fictional demo data ================= */
const DID1 = "(555) 019-2837", DID2 = "(555) 019-2841";
const state = { role: null, unlocked: false, adminPage: "dashboard", userPage: "overview", msgConv: 0 };
const USERS = [
  { u: "admin", role: "admin", ext: "—",    name: "Administrator", on: true },
  { u: "alex",  role: "user",  ext: "101",  name: "Alex Rivera",   on: true },
  { u: "sam",   role: "user",  ext: "102",  name: "Sam Chen",      on: true },
  { u: "front", role: "user",  ext: "100",  name: "Front Desk",    on: true },
  { u: "esp",   role: "user",  ext: "103",  name: "ESP32 Box",     on: true },
  { u: "guest", role: "user",  ext: "104",  name: "Guest Room",    on: false },
];
const CDR = [
  { from: "101", to: "102", dir: "ptt",      st: "ANSWERED", dur: "41s", bill: "41s", when: "Today 10:51 AM" },
  { from: "101", to: "102", dir: "ptt",      st: "ANSWERED", dur: "4s",  bill: "4s",  when: "Today 10:51 AM" },
  { from: "101", to: "8002553700", dir: "outbound", st: "ANSWERED", dur: "9s", bill: "9s", when: "Today 10:47 AM" },
  { from: DID1, to: "100", dir: "inbound",   st: "ANSWERED", dur: "2m 12s", bill: "2m 12s", when: "Today 9:15 AM" },
  { from: "102", to: DID2, dir: "outbound",  st: "NO ANSWER", dur: "0s", bill: "0s", when: "Yesterday 6:02 PM" },
];
const ACTIVITY = [
  { when: "4s ago",  ev: "signins.create",        by: "admin", det: "Signed in" },
  { when: "33m ago", ev: "ucp.messages.delete",   by: "101",   det: "3 rows" },
  { when: "36m ago", ev: "invites.delete",        by: "admin", det: "id=8" },
  { when: "36m ago", ev: "cdr.delete",            by: "admin", det: "29 rows" },
  { when: "38m ago", ev: "billing.access.save",   by: "admin", det: "5 users" },
];
const CONTACTS = [
  { name: "Alex Rivera", num: "101", org: "Family", note: "" },
  { name: "Sam Chen", num: "102", org: "Family", note: "Prefers texts" },
  { name: "Front Desk", num: "100", org: "House", note: "" },
  { name: "Pizza Place", num: "(555) 014-2288", org: "Food", note: "Friday nights" },
  { name: "School Office", num: "(555) 011-9042", org: "", note: "" },
];
const CONVS = [
  { with: "Sam · 102", msgs: [ { who: "Sam", text: "done got updated", when: "12:04 AM", mine: false } ] },
  { with: "Alex · 101", msgs: [ { who: "Alex", text: "hi", when: "10:47 PM", mine: false }, { who: "Me", text: "sup", when: "10:48 PM", mine: true }, { who: "Alex", text: "test", when: "10:54 PM", mine: false } ] },
];

/* ================= helpers ================= */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.remove("hidden"); setTimeout(() => t.classList.add("hidden"), 2200); }
function saved() { toast("Saved (demo — nothing is stored)"); }
function tbl(cols, rows, emptyMsg) {
  let h = "<table><tr>" + cols.map((c) => `<th>${c}</th>`).join("") + "</tr>";
  if (!rows.length) h += `<tr><td colspan="${cols.length}" class="empty">${emptyMsg || "Nothing here yet."}</td></tr>`;
  h += rows.join("") + "</table>";
  return h;
}
const row = (cells) => "<tr>" + cells.map((c) => `<td>${c}</td>`).join("") + "</tr>";
const ghost = (t, dis) => `<button class="btn ghost sm" ${dis ? "disabled" : ""} onclick="saved()">${t}</button>`;
const btn = (t) => `<button class="btn sm" onclick="saved()">${t}</button>`;
const danger = (t) => `<button class="btn danger sm" onclick="saved()">${t}</button>`;
const badge = (t, k) => `<span class="badge ${k || "green"}">${t}</span>`;
function modal(html) { $("modal").innerHTML = `<div class="modal"><div class="box">${html}</div></div>`; $("modal").classList.remove("hidden"); }
function closeModal() { $("modal").classList.add("hidden"); $("modal").innerHTML = ""; }
function pinModal() {
  modal(`<h3>Unlock edits</h3><p>Enter the admin PIN to unlock saving and changes. In this demo, any 4+ digit PIN works — try <b>1234</b>.</p>
  <label>PIN</label><input type="password" id="pininput" inputmode="numeric" placeholder="••••">
  <div class="row"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="tryPin()">Unlock</button></div>`);
  $("pininput").focus();
}
function tryPin() {
  const v = $("pininput").value.trim();
  if (!/^\d{4,12}$/.test(v)) { toast("PIN must be 4–12 digits (demo hint: 1234)"); return; }
  state.unlocked = true; closeModal(); renderPin(); toast("Edits unlocked for this session");
}
function renderPin() {
  $("pinbanner").innerHTML = state.role === "admin"
    ? (state.unlocked
      ? `<div class="banner ok">Edits unlocked — changes would save now. <button class="btn ghost sm" onclick="state.unlocked=false;renderPin()">Lock again</button></div>`
      : `<div class="banner">Edits locked — a PIN is needed to save or change anything. <button class="btn sm" onclick="pinModal()">Unlock with PIN</button></div>`)
    : "";
}

/* ================= shells / router ================= */
const ADMIN_NAV = [
  ["dashboard","Dashboard"],["logins","Logins"],["invites","Invites"],["trunks","Trunks"],["routes","Routes"],
  ["ringgroups","Ring groups"],["cdr","CDR"],["voicemail","Voicemail"],["recordings","Recordings"],["messages","Messages"],
  ["sms","SMS"],["features","Features"],["ivr","IVR"],["billing","Billing"],["store","Store"],["email","Email"],
  ["network","Network"],["signon","Sign-on"],["e911","E911"],["reports","Reports"],["apikeys","API Keys"],
  ["branding","Branding"],["myphone","My Phone"],
];
const USER_NAV = [
  ["overview","Overview"],["calls","Calls"],["voicemail","Voicemail"],["recordings","Recordings"],["messages","Messages"],
  ["ivr","IVR"],["billing","Billing"],["settings","Settings"],["app","App"],
];
const USER_SUB = [["overview","Overview"],["calls","Calls"],["voicemail","Voicemail"],["recordings","Recordings"],["messages","Messages"],["contacts","Contacts"],["ivr","IVR"],["billing","Billing"],["settings","Settings"],["app","App"]];

function doLogin() { quickLogin($("lu").value.trim() === "alex" ? "user" : "admin"); }
function quickLogin(role) {
  state.role = role; state.unlocked = false;
  $("login").classList.add("hidden"); $("app").classList.remove("hidden");
  $("who").innerHTML = role === "admin"
    ? `🌙 <span>admin (admin)</span><button onclick="logout()">Logout</button>`
    : `🌙 <span>101 (user)</span><button onclick="logout()">Logout</button>`;
  renderNav(); renderPin(); renderView();
  window.scrollTo(0, 0);
}
function logout() {
  state.role = null;
  $("app").classList.add("hidden"); $("login").classList.remove("hidden");
  $("who").innerHTML = "";
}
function renderNav() {
  const nav = state.role === "admin" ? ADMIN_NAV : USER_NAV;
  const cur = state.role === "admin" ? state.adminPage : state.userPage;
  $("mainnav").innerHTML = nav.map(([k, t]) =>
    `<button class="${k === cur ? "active" : ""}" onclick="go('${k}')">${t}</button>`).join("");
  const sub = $("subnav");
  if (state.role === "user") {
    sub.classList.remove("hidden");
    sub.innerHTML = USER_SUB.map(([k, t]) =>
      `<button class="${k === state.userPage ? "active" : ""}" onclick="go('${k}')">${t}</button>`).join("");
  } else sub.classList.add("hidden");
}
function go(page) {
  if (state.role === "admin") state.adminPage = page; else state.userPage = page;
  renderNav(); renderView(); window.scrollTo(0, 0);
}
function renderView() {
  const fn = state.role === "admin" ? ADMIN_VIEWS[state.adminPage] : USER_VIEWS[state.userPage];
  $("view").innerHTML = fn ? fn() : "<p>Coming soon.</p>";
}
</script>
<script>
/* ================= admin views (modeled on the real panel) ================= */
let INVITES = [ { ext: "105", sip: "user105", mail: "—", created: "Today 5:21 AM", exp: "in 7 days", st: "used" } ];
function genInvite() {
  const ext = String(106 + INVITES.length);
  INVITES.unshift({ ext, sip: "user" + ext, mail: $("invmail").value || "—", created: "just now", exp: "in 7 days", st: "waiting" });
  renderView(); toast("Invite created — the link is shown once (demo)");
}
let APIKEYS = [
  { key: "pbx_live_…a91f", name: "app", login: "101", created: "Oct 13, 1:24 AM", used: "—", active: true },
  { key: "pbx_live_…c204", name: "ESP32-Box-MSG_TOKEN", login: "103", created: "Oct 7, 2:55 PM", used: "—", active: true },
  { key: "pbx_live_…77bd", name: "edge", login: "admin", created: "Oct 6, 10:44 PM", used: "Oct 6, 10:52 PM", active: true },
];
function createKey() {
  modal(`<h3>Your new API key</h3><p>This is the only time the full key is shown. Copy it now.</p>
  <pre>pbx_live_demo_${Math.random().toString(36).slice(2, 10)}fictional</pre>
  <div class="row"><button class="btn" onclick="closeModal()">Done</button></div>`);
}

const ADMIN_VIEWS = {
/* ---- Dashboard ---- */
dashboard: () => `
  <h2 class="title">Dashboard</h2>
  <div class="statusbar"><span><b>Status:</b> <span style="color:var(--green)">Active</span></span><span class="sep">·</span>
  <span>Safety lock: <b>off</b></span> ${btn("Kill switch")} ${btn("Lock admin")} ${btn("Lock everything")}
  <span class="sep">·</span><span>Edit PIN: <b>${state.unlocked ? "unlocked" : "locked"}</b></span>
  ${state.unlocked ? ghost("Change PIN") : `<button class="btn sm" onclick="pinModal()">Unlock with PIN</button>`}</div>
  <div class="stats">
    <div class="stat"><div class="n">0</div><div class="l">live calls</div></div>
    <div class="stat"><div class="n">4</div><div class="l">devices online</div></div>
    <div class="stat"><div class="n">1</div><div class="l">sign-ins, 24h</div></div>
    <div class="stat"><div class="n">0</div><div class="l">failed, 24h</div></div>
    <div class="stat"><div class="n">0</div><div class="l">IPs blocked, 24h</div></div>
  </div>
  <h2>Live calls</h2>
  ${tbl(["From","To","Type","State","Duration"], [], "No calls right now")}
  <h2>Signed in now <span class="lede">3 internal · 1 external</span></h2>
