<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PBX Panel — Demo</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#f5f5f5;color:#222}
.nav{background:#1a1a2e;color:#fff;padding:12px 20px;display:flex;gap:20px;align-items:center}
.nav a{color:#aaccff;text-decoration:none}
.nav a:hover{color:#fff}
.nav .sp{flex:1}
.wrap{max-width:1100px;margin:20px auto;padding:0 20px}
.card{background:#fff;border-radius:8px;padding:20px;margin-bottom:20px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px;border-bottom:1px solid #eee}
th{background:#f8f8f8}
.btn{background:#1a1a2e;color:#fff;border:0;padding:8px 16px;border-radius:4px;cursor:pointer}
.btn:hover{background:#2a2a4e}
.btn.ghost{background:#fff;color:#1a1a2e;border:1px solid #1a1a2e}
.btn.danger{background:#fff;color:#b31d1d;border:1px solid #b31d1d}
input,select,textarea{padding:8px;border:1px solid #ddd;border-radius:4px;margin:4px 0}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.tabs a{padding:8px 16px;background:#fff;border-radius:4px;text-decoration:none;color:#333}
.tabs a.on{background:#1a1a2e;color:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.stat{background:#f8f8f8;border-radius:8px;padding:14px;text-align:center}
.stat b{font-size:26px;display:block}
.stat span{color:#666;font-size:12px}
.muted{color:#888;font-size:12px}
.ok{color:#0a7d2c}.bad{color:#c22}.warn{color:#8a5a00}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;background:#eee;color:#444}
.pill.ok{background:#e3f5e8;color:#0a7d2c}.pill.bad{background:#fde8e8;color:#b31d1d}.pill.warn{background:#fff3d6;color:#8a5a00}
.flash{padding:10px 14px;border-radius:6px;margin-bottom:16px;background:#e3f5e8;color:#0a5a22}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:22px}
.tile{background:#f8f8f8;border-radius:8px;padding:14px;color:inherit;text-decoration:none;display:block}
.tile .lbl{display:block;color:#666;font-size:12px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
.tile b{font-size:28px}
.panel{border:1px solid #eee;border-radius:8px;padding:16px}
.panel h3{margin-top:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
table.kv td:first-child{color:#666;width:130px}
.meter{display:inline-block;width:90px;height:6px;background:#eee;border-radius:3px;margin-left:8px;vertical-align:middle;overflow:hidden}
.meter span{display:block;height:100%;background:#1a1a2e}
.legal{background:#f7f7fb;border-left:3px solid #8a5a00;padding:10px 12px;font-size:13px;margin:8px 0;line-height:1.45}
.warnbox{background:#fff8e1;border-radius:8px;padding:14px 16px;margin:12px 0;font-size:14px;line-height:1.5}
.statusbar{border:1px solid #ddd;border-radius:8px;padding:12px 16px;margin-bottom:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
h2 .sub{display:block;font-size:13px;color:#888;font-weight:400;margin-top:2px}
/* demo extras */
.demo-ribbon{background:#8a5a00;color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;letter-spacing:.06em}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:99}
.toast{background:#1a1a2e;color:#fff;padding:12px 16px;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.25);max-width:320px;font-size:14px;animation:slidein .25s ease-out}
.toast b{display:block;margin-bottom:2px}
@keyframes slidein{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}
.role-switch{display:flex;gap:6px;align-items:center;font-size:13px}
.role-switch a{padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.12);color:#aaccff}
.role-switch a.on{background:#fff;color:#1a1a2e;font-weight:700}
.live-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#0a7d2c;margin-right:6px;animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.msgs{display:grid;grid-template-columns:220px 1fr;gap:16px}
.convs{border-right:1px solid #eee;padding-right:8px}
.conv{display:block;padding:8px;border-radius:6px;cursor:pointer}
.conv.on{background:#e6e6fa}
.conv b{display:block}
.conv span{font-size:12px;color:#666;display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bubble{max-width:70%;background:#f1f1f1;padding:8px 12px;border-radius:12px;margin:6px 0;font-size:14px}
.bubble.mine{background:#1a1a2e;color:#fff;margin-left:auto}
.bubble .meta{font-size:11px;color:#888;margin-top:2px}
.bubble.mine .meta{color:#bbc}
.bubble .rep{color:#c22;font-size:11px;text-decoration:none;margin-left:6px}
.newmsg{border:1px solid #eee;border-radius:8px;padding:14px;margin-bottom:14px}
.newmsg input,.newmsg textarea{width:100%;box-sizing:border-box}
@media (max-width:640px){.msgs{grid-template-columns:1fr}.convs{border:0}table{display:block;overflow-x:auto}.wrap{padding:0 10px}}
</style>
</head>
<body>

function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function fmtDur(ms){ const s=Math.floor(ms/1000); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
function toast(title, body){
  const d=document.createElement("div"); d.className="toast";
  d.innerHTML="<b>"+esc(title)+"</b>"+esc(body);
  document.getElementById("toasts").appendChild(d);
  setTimeout(()=>d.remove(), 5000);
}
function whoLabel(){ return S.role==="admin" ? "admin (admin)" : "alex (user)"; }

/* ---------------- login / nav / router ---------------- */
const ADMIN_TABS = [
  ["dashboard","Dashboard"],["logins","Logins"],["trunks","Trunks"],["routes","Routes"],
  ["ringgroups","Ring groups"],["cdr","CDR"],["voicemail","Voicemail"],["recordings","Recordings"],
  ["messages","Messages"],["sms","SMS"],["features","Features"],["ivr","IVR"],
  ["billing","Billing"],["email","Email"],["network","Network"],["e911","E911"],
  ["reports","Reports"],["apikeys","API Keys"],["ucp","My Phone"],
];
const USER_TABS = [
  ["ucp","Overview"],["ucp-calls","Calls"],["ucp-vm","Voicemail"],["ucp-rec","Recordings"],
  ["ucp-msgs","Messages"],["ucp-ivr","IVR"],["ucp-billing","Billing"],["ucp-settings","Settings"],
];
function nav(){
  if(!S.role) return `<div class="nav"><strong>PBX Panel</strong> <span class="demo-ribbon">DEMO</span></div>`;
  const tabs = S.role==="admin" ? ADMIN_TABS : USER_TABS;
  const links = tabs.map(([r,l])=>`<a href="#/${r}" class="${S.route===r?"on":""}">${l}</a>`).join("");
  return `<div class="nav"><strong>PBX Panel</strong> <span class="demo-ribbon">DEMO</span>
    <span class="role-switch">
      <a href="#" onclick="switchRole('admin');return false" class="${S.role==="admin"?"on":""}">Admin view</a>
      <a href="#" onclick="switchRole('user');return false" class="${S.role==="user"?"on":""}">User view</a>
    </span><span class="sp"></span>
    <span>${esc(whoLabel())}</span> <a href="#" onclick="logout();return false">Logout</a></div>
    <div class="wrap"><div class="tabs">${links}</div>`;
}
function switchRole(r){ S.role=r; sessionStorage.setItem("pbx_demo_role",r); S.route=r==="admin"?"dashboard":"ucp"; location.hash="#/"+S.route; }
function logout(){ S.role=null; sessionStorage.removeItem("pbx_demo_role"); location.hash="#/login"; }
function vLogin(){
  return `<div class="nav"><strong>PBX Panel</strong> <span class="demo-ribbon">DEMO</span></div>
  <div class="wrap"><div class="card" style="margin-top:40px">
    <h2>Login</h2>
    <p class="muted">Demo — pick a role, password is pre-filled as <code>demo</code>.</p>
    <select id="login-role" style="min-width:280px">
      <option value="admin" selected>Administrator (admin)</option>
      <option value="user">Alex Rivera (alex · 8800)</option>
    </select><br>
    <input type="password" id="login-pw" value="demo" placeholder="Password" style="min-width:280px"><br>
    <p><button class="btn" onclick="doLogin()">Sign in</button></p>
    <p class="muted">After signing in, use the <b>Admin view / User view</b> toggle in the top bar to switch roles.</p>
  </div></div>`;
}
function doLogin(){ switchRole(document.getElementById("login-role").value); toast("Welcome to the demo","Signed in (demo)."); }
const VIEWS = {};
function render(){
  const app = document.getElementById("app");
  const h = location.hash || "#/login";
  let route = h.replace(/^#\//,"").split("/")[0] || "login";
  if(route==="login" || !S.role){ app.innerHTML = vLogin(); document.title="PBX Panel — Demo login"; return; }
  const tabs = S.role==="admin" ? ADMIN_TABS : USER_TABS;
  if(!tabs.some(([r])=>r===route)) route = S.role==="admin" ? "dashboard" : "ucp";
  S.route = route;
  const fn = VIEWS[route] || VIEWS.dashboard;
  app.innerHTML = nav() + `<div class="card">` + fn() + `</div></div>`;
  const t = document.querySelector(".thread"); if(t) t.scrollTop = t.scrollHeight;
  document.title = "PBX Panel — demo";
}
window.addEventListener("hashchange", render);

VIEWS.dashboard = function(){

    <td>${a.ip}</td><td>${a.by}</td><td>${esc(a.details)}</td></tr>`).join("");
  return `<h2>Dashboard</h2>
  <div class="statusbar"><b>Status:</b> <span class="ok">Active</span> &nbsp;·&nbsp; Safety lock: <b>off</b>

    <div class="stat"><b>3</b><span>sign-ins, 24h</span></div>
    <div class="stat"><b>1</b><span>failed, 24h</span></div>
    <div class="stat"><b>2</b><span>IPs blocked, 24h</span></div>
  </div>
  <h3>Live calls</h3>
  <table><tr><th>From</th><th>To</th><th>Type</th><th>State</th><th>Duration</th></tr><tbody id="live-body">${calls}</tbody></table>
  <h3 style="margin-top:24px">Signed in now <span class="muted" style="font-weight:400">3 internal · 1 external</span></h3>
  <table><tr><th>Device</th><th>Ext</th><th>IP address</th><th>Where</th><th>Connection</th><th>Status</th><th>RTT</th></tr>${devs}</table>
  <h3 style="margin-top:24px">Recent sign-ins <span class="muted" style="font-weight:400">last 24 hours, older entries are removed automatically</span></h3>
  <p><button class="btn ghost" onclick="toast('Sign-ins','Demo only.')">Delete selected</button>
     <button class="btn danger" onclick="toast('Sign-ins','Demo only.')">Delete all</button></p>
  <table><tr><th></th><th>Login</th><th>IP</th><th>Result</th><th>When</th></tr>${signins}</table>
  <h3 style="margin-top:24px">Activity <span class="muted" style="font-weight:400">security events and changes, last 24 hours (older entries are removed automatically)</span></h3>
  <p class="muted"><input type="checkbox"> Security events only</p>
  <table><tr><th>When</th><th>Event</th><th>IP</th><th>By</th><th>Details</th></tr>${acts}</table>`;
};

VIEWS.logins = function(){
  const rows = LOGINS.map(l=>`<tr><td>${l.user}</td><td>${l.role}</td><td>${l.ext}</td><td>${l.sip}</td><td>${esc(l.name)}</td><td>${l.enabled}</td>

  return `<h2>Trunks</h2>

  const n = new Date(); const at = String(n.getHours()).padStart(2,"0")+":"+String(n.getMinutes()).padStart(2,"0");
  t.msgs.push({mine:false, body, at});
  if(S.route==="ucp-msgs" || S.route==="messages") render();
  toast("New SMS from "+t.contact, body+" (via "+t.via+")");
}
setInterval(simTick, 1000);
setInterval(simCalls, 15000);
setInterval(simSms, 35000);
if(!location.hash) location.hash = S.role ? "#/"+(S.role==="admin"?"dashboard":"ucp") : "#/login";
render();
</script>
</body>
</html>
