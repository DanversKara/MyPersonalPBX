name: Android release

# A release is a tag named android-vX.Y.Z. Normally android-auto-release.yml
# creates it; to do it by hand:
#   edit APP_VERSION_NAME in android/app/build.gradle.kts, commit,
#   git tag android-v0.7.4 && git push origin main android-v0.7.4

on:
  push:
    tags: ["android-v*"]
  workflow_dispatch:   # select a tag as the ref

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # Refuse a tag that does not match the version the build declares, so the
      # published file names never lie about what is inside.
      - name: Check the tag against the version in the build
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            android-v*) ;;
            *) echo "::error::'$GITHUB_REF_NAME' is not a release tag. Use a tag like android-v0.7.3."; exit 1 ;;
          esac
          tagged="${GITHUB_REF_NAME#android-v}"
          declared="$(sed -n 's/^val APP_VERSION_NAME = "\([^"]*\)"$/\1/p' android/app/build.gradle.kts)"
          if [ "$tagged" != "$declared" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match APP_VERSION_NAME ($declared) in android/app/build.gradle.kts."
            exit 1
          fi
          echo "APP_VERSION=$declared" >> "$GITHUB_ENV"

      - name: Decode the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. A release must be signed."
            exit 1
          fi
          keystore="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          echo "MYPHONE_KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"

      # The GitHub APK (self-updating) and the Google Play bundle (.aab), both
      # signed with the release key (for Play it is the upload key).
      - name: Build the signed release APK and Play bundle
        env:
          MYPHONE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MYPHONE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MYPHONE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set +e
          gradle -p android assembleGithubRelease bundlePlayRelease --no-daemon --console=plain > "$RUNNER_TEMP/build.log" 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            # The job log is awkward to reach; put the useful part in an annotation.
            msg="$( { grep -n -A25 -m1 'What went wrong' "$RUNNER_TEMP/build.log"; echo ----; grep -E 'Missing class|ERROR:|error:|e: ' "$RUNNER_TEMP/build.log" | head -25; } | head -c 3500 )"
            msg="${msg//'%'/'%25'}"; msg="${msg//$'\n'/'%0A'}"; msg="${msg//$'\r'/'%0D'}"
            echo "::error title=Gradle build failed::$msg"
            tail -n 60 "$RUNNER_TEMP/build.log"
            exit "$code"
          fi

      - name: Collect the artifacts
        run: |
          set -euo pipefail
          shopt -s nullglob
          out="$RUNNER_TEMP/artifacts"
          mkdir -p "$out"
          for apk in android/app/build/outputs/apk/github/release/*.apk; do
            cp "$apk" "$out/my-phone-$APP_VERSION.apk"
          done
          # Google Play bundle: upload it in Play Console (or automatically,
          # below). The app's self-updater only ever looks at .apk files.
          for aab in android/app/build/outputs/bundle/playRelease/*.aab; do
            cp "$aab" "$out/my-phone-$APP_VERSION-google-play.aab"
          done
          # R8 mapping (only present when minify is enabled).
          if [ -f android/app/build/outputs/mapping/githubRelease/mapping.txt ]; then
            cp android/app/build/outputs/mapping/githubRelease/mapping.txt "$out/my-phone-$APP_VERSION-mapping.txt"
          fi
          ls -l "$out"

      # Fails the release if the APK came out unsigned (the signing block in
      # build.gradle.kts silently does nothing when a value is missing).
      - name: Verify the APK is signed
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          for apk in "$RUNNER_TEMP"/artifacts/*.apk; do
            echo "== $(basename "$apk")"
            "$apksigner" verify --print-certs "$apk"
          done
          for aab in "$RUNNER_TEMP"/artifacts/*.aab; do
            echo "== $(basename "$aab")"
            jarsigner -verify "$aab" | tail -n 1
            jarsigner -verify "$aab" | grep -q "jar verified" || { echo "::error::$aab is not signed"; exit 1; }
          done

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: My Phone ${{ env.APP_VERSION }}
          files: ${{ runner.temp }}/artifacts/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true

      # Optional: send the bundle to Google Play's Internal testing track.
      # Set the PLAY_SERVICE_ACCOUNT_JSON secret (a Play Console service
      # account) to turn it on; without it this step is skipped and you
      # upload the .aab from the release by hand. The very first upload of
      # the app must be done by hand in Play Console.
      - name: Check for Google Play upload credentials
        id: play
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_JSON" ] && [ "${{ contains(github.ref_name, '-') }}" != "true" ]; then
            echo "upload=true" >> "$GITHUB_OUTPUT"
          else
            echo "upload=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Google Play::Not uploaded automatically (no PLAY_SERVICE_ACCOUNT_JSON secret). Upload my-phone-$APP_VERSION-google-play.aab in Play Console."
          fi

      - name: Upload to Google Play (Internal testing)
        if: steps.play.outputs.upload == 'true'
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: org.ownpbx.myphone
          releaseFiles: ${{ runner.temp }}/artifacts/*.aab
          track: ${{ vars.PLAY_TRACK || 'internal' }}
          status: ${{ vars.PLAY_STATUS || 'completed' }}
