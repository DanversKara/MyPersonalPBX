name: Android auto release

# Every push to main that changes the Android app becomes a release.
#
# This only decides the version and starts android-release.yml (which builds,
# signs and publishes). If main's APP_VERSION_NAME has not been released yet it
# is tagged as it is, so a hand bump still sets the version. If it has, the
# patch number is bumped, committed to main and tagged.
#
# A tag pushed with GITHUB_TOKEN does not trigger other workflows (GitHub's
# loop guard), so android-release.yml is started explicitly with
# workflow_dispatch on the new tag.

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-release.yml"
      - ".github/workflows/android-auto-release.yml"
      # Prose cannot change the APK; no release for it.
      - "!android/**/*.md"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# One at a time, never cancelled: two runs racing would pick the same version.
concurrency:
  group: android-auto-release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(android-release):') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Pick the version
        id: version
        run: |
          set -euo pipefail
          file=android/app/build.gradle.kts
          current="$(sed -n 's/^val APP_VERSION_NAME = "\([^"]*\)"$/\1/p' "$file")"
          if [ -z "$current" ]; then
            echo "::error::Could not read APP_VERSION_NAME from $file"
            exit 1
          fi

          git fetch --tags --force

          if git rev-parse -q --verify "refs/tags/android-v$current" >/dev/null; then
            # Already released: next patch (versionCode allows 2 digits per part).
            IFS=. read -r major minor patch <<< "${current%%-*}"
            patch=$((patch + 1))
            if [ "$patch" -gt 99 ]; then patch=0; minor=$((minor + 1)); fi
            if [ "$minor" -gt 99 ]; then minor=0; major=$((major + 1)); fi
            next="$major.$minor.$patch"

            sed -i "s/^val APP_VERSION_NAME = \".*\"$/val APP_VERSION_NAME = \"$next\"/" "$file"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore(android-release): $next"
            git push origin HEAD:main
          else
            next="$current"
          fi

          git tag "android-v$next"
          git push origin "android-v$next"
          echo "tag=android-v$next" >> "$GITHUB_OUTPUT"
          echo "Releasing android-v$next."

      - name: Start the release build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run android-release.yml --repo "$GITHUB_REPOSITORY" --ref "${{ steps.version.outputs.tag }}"
