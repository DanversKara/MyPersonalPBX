org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Server address pre-filled on the sign-in screen (people can still change
# it, and scanning a pairing QR code sets it). Override per build with
# -Pmyphone.defaultServer=https://pbx.example.com, or "" for an empty box.
myphone.defaultServer=https://myaccount.ownpbx.org
