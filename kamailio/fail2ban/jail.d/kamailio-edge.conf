# Fail2ban jails for the own-pbx Kamailio edge proxy.
# Debian 12/13 log to journald (no /var/log/syslog), so read the journal.
# Each ban/unban is also reported to the PBX (pbx-notify action), which
# shows it on the dashboard and emails the admin. Set that up with:
#   /usr/local/sbin/pbx-edge-notify --setup http://<pbx-ip>:8001 <admin API key>

# The office network is never banned: install.sh / update-edge.sh write
# /etc/fail2ban/jail.d/zz-local-ignore.conf (ignoreip incl. your LAN), which
# loads after this file and survives updates. Edit that file to change it.

# Scanners, password guessing, junk: 8 hits in 10 minutes -> banned 1 hour.
[kamailio-edge]
enabled = true
filter = kamailio-edge
backend = systemd
journalmatch = _SYSTEMD_UNIT=kamailio.service
maxretry = 8
findtime = 600
bantime = 3600
port = 5061
protocol = tcp
action = %(action_)s
         pbx-notify[name=kamailio-edge]

# Floods: one detection -> banned 24 hours.
[kamailio-edge-flood]
enabled = true
filter = kamailio-edge-flood
backend = systemd
journalmatch = _SYSTEMD_UNIT=kamailio.service
maxretry = 1
findtime = 600
bantime = 86400
port = 5061
protocol = tcp
action = %(action_)s
         pbx-notify[name=kamailio-edge-flood]
