# Kamailio TLS server profile for the own-pbx edge proxy.
# install.sh drops the certificate/key at /etc/kamailio/tls/ (self-signed
# by default; replace with a Let's Encrypt pair for a public hostname).

[server:default]
method = TLSv1.2+
verify_certificate = no
require_certificate = no
certificate = /etc/kamailio/tls/cert.pem
private_key = /etc/kamailio/tls/key.pem
